services:
  - type: web
    name: advisers-portal
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: node render-start.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORTAL_TRUST_PROXY
        value: "true"
      - key: PORTAL_STORAGE_MODE
        value: dual
      - key: SUPABASE_DB_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
